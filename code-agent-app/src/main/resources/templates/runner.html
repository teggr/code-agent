<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.js"></script>
  <title>Runner</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 32px; }
    .shell { max-width: 1000px; margin: 0 auto; }
    .panel { background: white; border: 2px solid #333; border-radius: 14px; padding: 18px; margin-bottom: 24px; box-shadow: 4px 4px 0 #d9d9d9; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .row textarea { flex: 1; padding: 10px 12px; border: 2px solid #2a2a2a; border-radius: 8px; font-size: 14px; }
    .button { background: white; color: #111; border: 2px solid #333; border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
    .button.disabled { opacity: .5; pointer-events: none; cursor: default; }
    .top-nav { margin-bottom: 16px; }
    .meta { color: #555; font-size: 13px; }
    .messages { border: 2px solid #333; border-radius: 10px; padding: 12px; background: white; }
    .msg { padding: 8px 0; border-bottom: 1px solid #d0d0d0; white-space: pre-wrap; }
    .msg:last-child { border-bottom: none; }
    .role { font-weight: bold; display: inline-block; width: 80px; }
    .msg-tool, .msg-system { color: #666; font-style: italic; }
    .msg-question { color: #7a4d00; font-weight: bold; }
    #stop-button.disabled { opacity: .5; pointer-events: none; cursor: default; }
  </style>
</head>
<body>
  <div class="shell" hx-ext="sse" th:attr="sse-connect=|/runners/${runnerId}/sessions/${sessionId}/events|">
    <nav class="top-nav">
      <a class="button" href="/">Back to dashboard</a>
      <a class="button" id="vscode-link" sse-swap="vscode" hx-swap="outerHTML"
         th:classappend="${vscodeReady} ? '' : ' disabled'"
         th:href="${vscodeReady} ? ${devContainerUri} : '#'"
         th:text="${vscodeReady} ? 'VS Code' : 'VS Code (starting…)'">VS Code</a>
      <form method="post" th:action="|/runners/${runnerId}/stop|" style="display:inline">
        <button class="button" type="submit" th:disabled="${!promptable}">Stop runner</button>
      </form>
      <form method="post" th:action="|/runners/${runnerId}/start|" style="display:inline">
        <button class="button" type="submit" th:disabled="${promptable}">Start runner</button>
      </form>
      <form method="post" th:action="|/runners/${runnerId}/remove|" style="display:inline">
        <button class="button" type="submit">Remove runner</button>
      </form>
    </nav>
    <div class="panel">
      <div class="row"><h2>Runner: <span th:text="${runnerId}">runner-id</span></h2></div>
      <div class="meta">Repo: <span th:text="${repoUrl}">repo-url</span></div>
      <div class="meta">Status: <span class="status" id="runner-status" sse-swap="status" hx-swap="outerHTML" th:text="${status}">IDLE</span></div>
      <div class="row">
        <strong>Sessions</strong>
        <form method="post" th:action="|/runners/${runnerId}/sessions|">
          <button class="button" type="submit">New session</button>
        </form>
      </div>
      <div class="row" th:if="${sessions != null}">
        <a class="button" th:each="candidate : ${sessions}"
           th:href="|/runners/${runnerId}/sessions/${candidate.id}|"
           th:text="${candidate.id == sessionId ? 'Current session' : candidate.id.substring(0, 8)}">session</a>
        <form method="post" th:action="|/runners/${runnerId}/sessions/${sessionId}/remove|">
          <button class="button" type="submit">Close session</button>
        </form>
      </div>
    </div>

    <div class="panel">
      <div class="messages" id="messages" sse-swap="message" hx-swap="beforeend">
        <div class="msg" th:each="message : ${messages}" th:classappend="'msg-' + ${message.role}">
          <span class="role" th:text="${message.role}">user</span>
          <span th:text="${message.content}">content</span>
        </div>
      </div>
    </div>

    <div id="pending-question" sse-swap="question" hx-swap="outerHTML">
      <div class="panel" th:if="${pendingQuestion != null}">
        <div class="row"><strong>Agent is asking:</strong></div>
        <div class="row" th:text="${pendingQuestion.prompt}">question</div>
        <form th:if="${pendingQuestion.choices != null and !#lists.isEmpty(pendingQuestion.choices)}"
              method="post" th:action="|/runners/${runnerId}/sessions/${sessionId}/answer|">
          <input type="hidden" name="questionId" th:value="${pendingQuestion.id}"/>
          <div class="row">
            <button class="button" type="submit" name="answer" th:each="choice : ${pendingQuestion.choices}"
                    th:value="${choice}" th:text="${choice}">choice</button>
          </div>
        </form>
        <form th:unless="${pendingQuestion.choices != null and !#lists.isEmpty(pendingQuestion.choices)}"
              method="post" th:action="|/runners/${runnerId}/sessions/${sessionId}/answer|">
          <input type="hidden" name="questionId" th:value="${pendingQuestion.id}"/>
          <div class="row">
            <input type="text" name="answer" placeholder="Your answer"/>
            <button class="button" type="submit">Send</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel">
      <form method="post" th:action="|/runners/${runnerId}/sessions/${sessionId}/prompt|">
        <div class="row">
          <textarea name="prompt" rows="5" th:disabled="${!promptable}"
                    th:placeholder="${promptable} ? 'Send a message to this runner' : 'No agent is connected to this runner'"></textarea>
        </div>
        <div class="row">
          <button class="button" type="submit" th:disabled="${!promptable}">Send message</button>
          <button class="button" id="stop-button" type="submit" formmethod="post"
                  th:formaction="|/runners/${runnerId}/sessions/${sessionId}/abort|"
                  th:classappend="${status.name() == 'BUSY'} ? '' : ' disabled'">Stop</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
