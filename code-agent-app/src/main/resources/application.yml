codeagent:
  agent:
    restore-existing-on-startup: true
    workspace:
      git:
        token: ${GH_TOKEN:}
    runtime:
      docker:
        image: teggr/code-agent-runner:0.1.0-SNAPSHOT
        # Socket path as seen by the daemon host. Blank uses /var/run/docker.sock.
        socket-path: ""
  harness:
    copilot:
      token: ${COPILOT_GITHUB_TOKEN:}
      max-retries: 30
      retry-delay-ms: 500
      start-timeout-seconds: 5
      log-level: debug
  schedule:
    data-dir: ${user.home}/.code-agent/data
    idle-timeout: 5m

spring:
  datasource:
    url: jdbc:h2:file:${codeagent.schedule.data-dir}/scheduler;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
