<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2/sse.js"></script>
  <title>Code Agent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 32px; }
    .shell { max-width: 1200px; margin: 0 auto; }
    .panel { background: white; border: 2px solid #333; border-radius: 14px; padding: 18px; margin-bottom: 24px; box-shadow: 4px 4px 0 #d9d9d9; }
    .row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .row input, .row textarea, .row select { flex: 1; padding: 10px 12px; border: 2px solid #2a2a2a; border-radius: 8px; font-size: 14px; }
    .card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 2px solid #2a2a2a; border-radius: 10px; background: #fafafa; margin-bottom: 10px; }
    .button { background: white; color: #111; border: 2px solid #333; border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; }
    .meta { font-size: 13px; color: #555; }
    .status { display: inline-block; padding: 4px 8px; border: 1px solid #333; border-radius: 99px; font-size: 12px; }
    .messages { border: 2px solid #333; border-radius: 10px; padding: 12px; background: white; }
    .msg { padding: 8px 0; border-bottom: 1px solid #d0d0d0; }
    .msg:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="shell" hx-ext="sse" sse-connect="/agents/events">
    <div class="panel">
      <h2>Start a new agent</h2>
      <form method="post" action="/agents" onsubmit="return confirmEmptyWorkspaceStart(this)">
        <div th:replace="~{fragments :: repositoryPicker}"></div>
        <div class="row">
          <textarea name="prompt" rows="5" placeholder="Describe the task you want the agent to run"></textarea>
        </div>
        <div class="row">
          <button class="button" type="submit">Start task</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Hosted agents</h2>
      <div id="agent-list" sse-swap="agentList">
        <div th:replace="~{fragments :: agentList(${agents})}"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Schedule a recurring agent</h2>
      <form method="post" action="/scheduled-tasks" onsubmit="return confirmEmptyWorkspaceStart(this)">
        <div th:replace="~{fragments :: repositoryPicker}"></div>
        <div class="row">
          <textarea name="prompt" rows="5" placeholder="Describe the task the agent should run on each fire"></textarea>
        </div>
        <div class="row">
          <input name="cronExpression" type="text" placeholder="Cron expression, e.g. 0 0 9 * * MON-FRI"/>
        </div>
        <div class="row">
          <button class="button" type="submit">Schedule task</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Scheduled tasks</h2>
      <div id="scheduled-task-list" sse-swap="scheduledTaskList">
        <div th:replace="~{fragments :: scheduledTaskList(${scheduledTasks})}"></div>
      </div>
    </div>
  </div>
  <script>
    // No repoUrl input means the agent would start with an empty workspace; confirm to avoid an accidental click.
    function confirmEmptyWorkspaceStart(form) {
      var repoUrl = form.querySelector('input[name="repoUrl"]');
      if (repoUrl && repoUrl.value) {
        return true;
      }
      return confirm("Start an agent with no repository selected (empty workspace)?");
    }
  </script>
</body>
</html>
